<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIT3179 DV2 vega</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">

    <!-- Load the Vega & Vega-Lite libraries -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12 text-center">
                <h2>Higher Education Pathways in Australia</h2>
                <p>An overview of student transitions and study participation across the country.</p>
                <!-- Map Container -->
                <div id="choropleth_map"></div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        var spec = "jsons/map_participation.vg.json";
        vegaEmbed('#choropleth_map', spec).then(function(result) {
            // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
        }).catch(console.error);
    </script>

    <div class="row mt-5">
        <div class="col-md-6">
            <div id="bubble_map"></div>
        </div>
        <div class="col-md-6">
            <div class="col-md-6">
            <div id="flow_map"></div>
        </div>
        </div>
    </div>

    <script type="text/javascript">
    // ... your existing scripts ...
    
    var spec3 = "jsons/map_bubbles.vg.json";
    vegaEmbed('#bubble_map', spec3).catch(console.error);
    </script>

    <script type="text/javascript">
  // ... previous chart scripts
    var spec4 = "jsons/map_flow.vg.json";
    vegaEmbed('#flow_map', spec4).catch(console.error);
    </script>

</body>
</html>
